<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img">
  <title>Diagram of source of funds, who is the investor of record, derivatives under 21, and concurrent filing with F-1 or OPT.</title>
  <desc>Diagram of source of funds, who is the investor of record, derivatives under 21, and concurrent filing with F-1 or OPT.</desc>
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <text x="36" y="64" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="28" fill="#262626">What families typically weigh</text>
  <rect x="36" y="108" width="1128" height="52" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="60" y="141" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#262626">Source of funds relative to graduation</text>
<rect x="36" y="172" width="1128" height="52" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="60" y="205" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#262626">Parent or student as investor of record</text>
<rect x="36" y="236" width="1128" height="52" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="60" y="269" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#262626">Spouse and siblings under 21</text>
<rect x="36" y="300" width="1128" height="52" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="60" y="333" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#262626">Concurrent filing with F-1 or OPT</text>
