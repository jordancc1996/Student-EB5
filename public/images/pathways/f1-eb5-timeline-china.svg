<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
  <title>F-1 to EB-5 timeline</title>
  <desc>Diagram of graduation, OPT, STEM OPT, an I-526E filing, and work authorization for a Chinese student.</desc>
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <text x="36" y="64" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="28" fill="#262626">F-1 to EB-5 timeline</text>
  <rect x="36" y="128" width="208" height="132" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="140" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626"><tspan x="140" dy="0">Graduation</tspan></text>
<line x1="246" y1="194" x2="257" y2="194" stroke="#262626" stroke-width="1.5"/>
<polygon points="256,190 264,194 256,198" fill="#262626"/>
<rect x="266" y="128" width="208" height="132" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="370" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626"><tspan x="370" dy="0">OPT</tspan></text>
<line x1="476" y1="194" x2="487" y2="194" stroke="#262626" stroke-width="1.5"/>
<polygon points="486,190 494,194 486,198" fill="#262626"/>
<rect x="496" y="128" width="208" height="132" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="600" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626"><tspan x="600" dy="0">STEM OPT</tspan></text>
<line x1="706" y1="194" x2="717" y2="194" stroke="#262626" stroke-width="1.5"/>
<polygon points="716,190 724,194 716,198" fill="#262626"/>
<rect x="726" y="128" width="208" height="132" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="830" y="200" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626"><tspan x="830" dy="0">I-526E</tspan></text>
<line x1="936" y1="194" x2="947" y2="194" stroke="#262626" stroke-width="1.5"/>
<polygon points="946,190 954,194 946,198" fill="#262626"/>
<rect x="956" y="128" width="208" height="132" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="1060" y="189" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626"><tspan x="1060" dy="0">Work</tspan><tspan x="1060" dy="22">authorization</tspan></text>
</svg>
