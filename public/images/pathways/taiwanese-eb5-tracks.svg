<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img">
  <title>Diagram comparing a Taiwanese investor I-526E filing, OPT and H-1B planning, and gifted capital.</title>
  <desc>Diagram comparing a Taiwanese investor I-526E filing, OPT and H-1B planning, and gifted capital.</desc>
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <text x="36" y="64" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="28" fill="#262626">Taiwanese investors, students, and families</text>
  <rect x="36" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="216" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">Investors</text>
<text x="216" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Source of funds</text>
<text x="216" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Form I-526E</text>
<rect x="420" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="600" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">Students</text>
<text x="600" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">OPT or STEM OPT</text>
<text x="600" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">H-1B planning</text>
<rect x="804" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="984" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">Families</text>
<text x="984" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Gifted capital</text>
<text x="984" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Lawful trail</text>
</svg>
