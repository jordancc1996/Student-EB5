<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img">
  <title>Diagram comparing E-2 treaty investor status, L-1 intracompany transfer, and O-1 extraordinary ability.</title>
  <desc>Diagram comparing E-2 treaty investor status, L-1 intracompany transfer, and O-1 extraordinary ability.</desc>
  <rect width="100%" height="100%" fill="#FAF9F6"/>
  <text x="36" y="64" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="28" fill="#262626">E-2, L-1, and O-1</text>
  <rect x="36" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="216" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">E-2</text>
<text x="216" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Treaty investor</text>
<text x="216" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Not a direct green card</text>
<rect x="420" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="600" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">L-1</text>
<text x="600" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Intracompany transfer</text>
<text x="600" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Tied to the employer</text>
<rect x="804" y="112" width="360" height="220" fill="#FFFFFF" stroke="#262626" stroke-width="1.5"/>
<text x="984" y="160" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="22" fill="#262626">O-1</text>
<text x="984" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">Extraordinary ability</text>
<text x="984" y="242" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#262626">No EB-5 capital investment</text>
</svg>
